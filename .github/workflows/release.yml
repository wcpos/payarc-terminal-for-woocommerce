name: Release

# A stable release is cut by a push to `main` whose plugin header carries a new X.Y.Z.
# A beta is cut by dispatching this workflow on `next` with an X.Y.Z-betaN header: it is
# published as a GitHub prerelease, which `releases/latest` never returns, so the
# extension catalog and every merchant's updater never see it. Beta testers install
# the zip by hand. The guards below keep the lanes apart: a push never cuts a beta
# and a dispatch never cuts a stable.
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Check if release is needed
        id: check_release
        run: |
          set -euo pipefail

          VERSION=$(grep -oP "Version:\s*\K\S+" payarc-terminal-for-woocommerce.php)
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-beta[0-9]+)?$ ]]; then
            echo "::error::Version header '$VERSION' is neither X.Y.Z nor X.Y.Z-betaN"
            exit 1
          fi
          if [[ "$VERSION" == *-beta* ]]; then
            if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ] || [ "$GITHUB_REF" != "refs/heads/next" ]; then
              echo "::error::$VERSION is a beta; a beta is cut only by dispatching this workflow on next, never by a push to main or from another ref"
              exit 1
            fi
            PRERELEASE=true
          else
            if [ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]; then
              echo "::error::$VERSION is a stable version; a stable release is cut only by a push to main"
              exit 1
            fi
            PRERELEASE=false
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "PRERELEASE=$PRERELEASE" >> "$GITHUB_ENV"
          git fetch --prune --tags

          if ! git tag | grep -qx "v$VERSION"; then
            echo "Version has changed. Creating new release..."
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! gh release view "v$VERSION" --json assets --jq '.assets[].name' | grep -qx 'payarc-terminal-for-woocommerce.zip'; then
            echo "Release exists without ZIP asset. Rebuilding and uploading asset..."
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Version has not changed and ZIP asset already exists. Skipping release..."
          echo "release=false" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install composer dependencies
        if: steps.check_release.outputs.release == 'true'
        run: composer install --no-dev

      - name: Build ZIP
        if: steps.check_release.outputs.release == 'true'
        run: |
          # WordPress 7.1.4+ unpacks packages into a randomly suffixed folder and installs a flat zip
          # there, so the zip must hold the installed folder (catalog slug) as its only top-level entry.
          mkdir -p "$RUNNER_TEMP/stage/payarc-terminal-for-woocommerce"
          rsync -a --exclude='.git*' ./ "$RUNNER_TEMP/stage/payarc-terminal-for-woocommerce/"
          (cd "$RUNNER_TEMP/stage" && zip -r "$GITHUB_WORKSPACE/payarc-terminal-for-woocommerce.zip" "payarc-terminal-for-woocommerce" -x "*.git*")
          TOP_LEVEL=$(unzip -Z1 payarc-terminal-for-woocommerce.zip | cut -d/ -f1 | sort -u)
          if [ "$TOP_LEVEL" != "payarc-terminal-for-woocommerce" ]; then
            echo "::error::payarc-terminal-for-woocommerce.zip must contain only payarc-terminal-for-woocommerce/ at the top level, found: $TOP_LEVEL"
            exit 1
          fi

      - name: Create release and upload ZIP
        if: steps.check_release.outputs.release == 'true'
        run: |
          set -euo pipefail

          NOTES_FILE="docs/releases/$VERSION.md"
          # A beta is the unreleased work on next; its notes are docs/releases/next.md as it stands.
          if [ ! -f "$NOTES_FILE" ] && [ "$PRERELEASE" = "true" ]; then
            NOTES_FILE="docs/releases/next.md"
          fi
          NOTES_ARGS=(--notes "Release v$VERSION")
          if [ -f "$NOTES_FILE" ]; then
            NOTES_ARGS=(--notes-file "$NOTES_FILE")
          fi
          PRERELEASE_ARGS=()
          if [ "$PRERELEASE" = "true" ]; then
            PRERELEASE_ARGS=(--prerelease)
          fi

          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" payarc-terminal-for-woocommerce.zip --clobber
            gh release edit "v$VERSION" "${NOTES_ARGS[@]}"
          else
            # Without --target a missing tag is created from the default branch, not the commit built here.
            gh release create "v$VERSION" \
              payarc-terminal-for-woocommerce.zip \
              --target "$GITHUB_SHA" \
              --title "Release v$VERSION" \
              "${NOTES_ARGS[@]}" \
              "${PRERELEASE_ARGS[@]}"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
